services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    restart: always
    ports:
      - 8000:8000
    env_file:
      - ./server/.env
    depends_on:
      - inngest
    develop:
      watch:
        - action: sync
          path: ./server
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .git/
            - .venv/
        - action: rebuild
          path: ./server/pyproject.toml
        - action: rebuild
          path: ./server/uv.lock

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    network_mode: "host"
    env_file:
      - ./client/.env
    depends_on:
      - server
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
          ignore:
            - node_modules/
            - .next/
            - bun.lock
        - action: rebuild
          path: ./client/package.json

  inngest:
    image: inngest/inngest:latest
    command: "inngest dev -u http://server:8000/api/inngest"
    ports:
      - 8288:8288
      - 8289:8289

  elasticsearch:
    image: elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - 9200:9200

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  esdata:
  