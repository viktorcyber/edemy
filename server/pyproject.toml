[project]
name = "server"
version = "0.1.0"
description = "Discover and learn about any topic 🔖"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "clerk-backend-api>=7.0.0",
    "dj-database-url>=3.1.2",
    "django>=6.1",
    "django-chartjs>=2.3.0",
    "django-ckeditor-5>=0.2.20",
    "django-cloudinary-storage>=0.3.0",
    "django-cors-headers>=4.9.0",
    "django-elasticsearch-dsl>=8,<9",
    "djangorestframework>=3.18.0",
    "drf-spectacular[sidecar]>=0.30.0",
    "elasticsearch>=8,<9",
    'elasticsearch-dsl>8,<9',
    "gunicorn>=26.2.0",
    "inngest>=0.5.19",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "sentry-sdk>=2.68.1",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.1.1",
    "django-silk>=5.5.2",
    "ipykernel>=7.3.0",
    "pyright>=1.1.411",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-factoryboy>=2.8.1",
    "ruff>=0.16.4",
]

[tool.ruff.lint]
ignore = ["RUF012"]
