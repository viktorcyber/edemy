services:
  server:
    image: ${IMAGE_NAMESPACE:-edemy}/server:${IMAGE_TAG:-latest}
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    restart: always
    ports:
      - 8000:8000
    env_file:
      - ./server/.env.prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  client:
    image: ${IMAGE_NAMESPACE:-edemy}/client:${IMAGE_TAG:-latest}
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    restart: always
    env_file:
      - ./client/.env.prod
    ports:
      - 3000:3000

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 1137:80
    depends_on:
      - server
      - client

